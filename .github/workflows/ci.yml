name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.19', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: node --check lib/index.js && node --check lib/provider.js && node --check lib/client.js && node --check lib/sse.js && node --check lib/pow.js && node --check lib/credentials.js && node --check lib/envelope.js

      - name: 单元测试
        run: node --test

      - name: 敏感信息扫描
        run: node scripts/scan-secrets.mjs --all
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    web search 主题图标：地球为主体 + 放大镜聚焦，
    对应 Material 的 travel_explore 范式 —— 一眼即"在互联网上检索"。
    纯几何绘制，不依赖字体/外链，data URL 内嵌安全。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d6bfe"/>
      <stop offset="1" stop-color="#2c49d6"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>

  <!-- 地球：圆 + 经纬线 -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <circle cx="28" cy="28" r="17"/>
    <!-- 经线（两条椭圆弧） -->
    <ellipse cx="28" cy="28" rx="8" ry="17"/>
    <!-- 纬线 -->
    <line x1="11.5" y1="22.5" x2="44.5" y2="22.5"/>
    <line x1="11.5" y1="33.5" x2="44.5" y2="33.5"/>
  </g>

  <!-- 放大镜：叠在地球右下，柄朝外 -->
  <g>
    <circle cx="42" cy="42" r="10" fill="#2c49d6" stroke="#ffffff" stroke-width="4.5"/>
    <line x1="50" y1="50" x2="58" y2="58" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 镜片内的光点：检索命中感，克制的一笔 -->
  <circle cx="39.5" cy="39.5" r="2" fill="#ffffff" opacity="0.9"/>
</svg>
